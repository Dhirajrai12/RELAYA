# Prometheus for Relaya: scrapes the API and ingest services and the Windows host.
# Everything listens on 127.0.0.1; install.ps1 installs this next to prometheus.exe.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: relaya-api
    authorization:
      credentials_file: metrics_token # METRICS_TOKEN from bin\.env, written by install.ps1
    static_configs:
      - targets: ['127.0.0.1:8080']

  - job_name: relaya-ingest
    authorization:
      credentials_file: metrics_token
    static_configs:
      - targets: ['127.0.0.1:8081']

  - job_name: windows
    static_configs:
      - targets: ['127.0.0.1:9182']

  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
