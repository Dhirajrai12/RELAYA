# Local dev stack (Linux/macOS/Docker Desktop). Copy .env.example to .env first.
#   docker compose up --build
# API: http://localhost:8080   Ingest: http://localhost:8081
# Production on Windows Server runs natively behind IIS instead: see deploy/iis/.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relaya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relaya}
      POSTGRES_DB: relaya
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaya -d relaya"]
      interval: 3s
      retries: 20

  migrate:
    build: .
    command: ["/app/migrate"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    build: .
    command: ["/app/ingest"]
    env_file: .env
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: .
    command: ["/app/api"]
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["/app/worker"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
